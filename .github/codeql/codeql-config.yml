# Custom CodeQL configuration for AlpacaBridge.
#
# cpp/cleartext-transmission is excluded as a false positive for this codebase:
# it flags site latitude/longitude ("private location data") written through the
# shared serial helpers in AlpacaCore/include/alpacacore/util/serial_io.h. Those
# writes go to a local USB/serial port connected to mount hardware — LX200-style
# protocols require sending site coordinates to the mount — not over a network,
# so there is nothing to encrypt. Every telescope driver funnels coordinates
# through serial_io.h, so the exclusion is repo-wide rather than per-alert.
#
# AlpacaCore/external/ is not scanned: its C/C++ is vendor SDK code, kept exactly
# as the vendor ships it (see AlpacaCore/external/README.md), so a finding there
# is not ours to fix. The workflow uses build-mode: none, which extracts every
# C/C++ file in the tree, so without this the SDKs' unbuilt sample programs
# (ToupTek's samples/) raise alerts on every scan. Our own code that calls the
# SDKs lives under AlpacaCore/src/vendors/ and is still scanned.
paths-ignore:
  - AlpacaCore/external/**
query-filters:
  - exclude:
      id: cpp/cleartext-transmission
