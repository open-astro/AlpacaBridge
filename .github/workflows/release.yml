# Publish a GitHub Release for every version tag.
#
# Binaries are NOT attached here. The install channel is the OpenAstro APT
# repository (https://apt.openastro.net); a Release exists so a shipped build
# has a name, a source archive (GitHub attaches the zip/tarball itself), and
# its release notes. Nothing is compiled, so this runs in seconds.
#
# Flow: `/bump-release` cuts the release on a PR (VERSION, README badge,
# dated CHANGELOG heading, plain-language notes in docs/releases/X.Y.Z.md),
# merges it, tags the merge commit and pushes the tag. The notes file, when
# present, becomes the Release body with a link to the CHANGELOG section;
# otherwise the CHANGELOG section itself is used.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release from CHANGELOG
    runs-on: ubuntu-24.04-arm   # text-only; kept on arm64 for a single-arch fleet
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.x pinned (immutable ref)
        with:
          persist-credentials: false

      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${tag_version}" != "${file_version}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match VERSION file (${file_version})." >&2
            echo "Cut the release on a PR first (VERSION, README badge, dated CHANGELOG), then tag the merge." >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches VERSION ${file_version}."

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Always run the extractor: it fails if the CHANGELOG section is
          # missing or still UNRELEASED, so a tag can never publish an uncut
          # version even when plain-language notes exist for it.
          python3 scripts/changelog_section.py --self-test
          python3 scripts/changelog_section.py "${version}" > /dev/null   # gate only: fails on a missing or UNRELEASED section
          anchor="$(python3 scripts/changelog_section.py --anchor "${version}")"
          if [ -f "docs/releases/${version}.md" ]; then
            # Plain-language notes written by /bump-release; the CHANGELOG
            # keeps the technical detail and is linked instead of pasted.
            cp "docs/releases/${version}.md" release-notes.md
            # Force a newline-terminated body: without one the "---" below
            # would render as a setext heading over the file's last line.
            [ "$(tail -c1 release-notes.md)" = "" ] || echo "" >> release-notes.md
            {
              echo ""
              echo "---"
              echo "Full technical changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md#${anchor}"
            } >> release-notes.md
          else
            python3 scripts/changelog_section.py "${version}" > release-notes.md
            {
              echo ""
              echo "---"
            } >> release-notes.md
          fi
          {
            echo ""
            echo "Install or upgrade via the OpenAstro APT repository: https://apt.openastro.net"
          } >> release-notes.md
          echo "::group::Release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating notes."
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
          fi

      - name: Trigger the apt.openastro.net release
        # Ask open-astro/apt-openastro-net to build, sign and publish this
        # tag's .deb right away (its Release workflow listens for this event
        # and builds AlpacaBridge at the tag it is given). That repo is private
        # and GITHUB_TOKEN is scoped to this one, so it takes a dedicated
        # token: APT_REPO_DISPATCH_TOKEN, a fine-grained PAT for that single
        # repo with Contents: read & write (what repository_dispatch needs).
        # Without the secret this only warns — apt-openastro-net also polls
        # this repo's latest Release every hour, so the .deb still ships, just
        # up to an hour later.
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::APT_REPO_DISPATCH_TOKEN is not set; apt-openastro-net will pick up ${TAG} on its hourly poll instead."
            exit 0
          fi
          printf '{"event_type":"alpacabridge-release","client_payload":{"tag":"%s"}}\n' "${TAG}" \
            | gh api --method POST repos/open-astro/apt-openastro-net/dispatches --input -
          echo "Dispatched alpacabridge-release (${TAG}) to open-astro/apt-openastro-net."
