# Decision-record authorization (docs/decisions/README.md, "Changing a record").
#
# A PR that changes a file under docs/decisions/ needs a repository
# collaborator (write, maintain or admin) to comment `ADR authorized <head sha>`.
# scripts/check_adr_authorization.py decides and posts the result as the
# commit status `adr-authorization` on the PR head, which the ruleset requires.
#
# Two triggers, one result. pull_request_target re-evaluates on every push (a
# new head needs a new authorization); issue_comment re-evaluates when someone
# comments. Both run the definition and the script from the default branch, so
# a PR cannot edit the gate that judges it, and neither checks out or runs any
# PR code: the job reads the PR through the API only.
name: Decision records

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run; API reads only
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: adr-authorization-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  adr-authorization:
    # issue_comment fires for issues too; only PR comments matter.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The default branch, explicitly: never the PR head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/check_adr_authorization.py
          sparse-checkout-cone-mode: false

      - name: Decide and post the adr-authorization status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          python3 -I scripts/check_adr_authorization.py --self-test
          python3 -I scripts/check_adr_authorization.py --repo "${REPO}" --pr "${PR_NUMBER}" --post-status
