# CodeQL static security analysis for AlpacaBridge (C++).
#
# Complements the manual `security-review` workflow with automated scanning on
# every PR and a weekly scheduled sweep (catches advisories published against
# code that hasn't changed).
#
# Runner/build note: the CodeQL CLI has no linux/arm64 build, yet AlpacaBridge
# only *compiles* on arm64 (CMake hard-fails elsewhere) — so a build-based scan
# is impossible. We therefore run on x86_64 with `build-mode: none`, CodeQL's
# buildless C/C++ extractor, which analyzes the sources without compiling them.
# This scans the code we author; the vendored SDK trees under
# AlpacaCore/external/ are not our code and are excluded below.

name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 06:00 UTC — surfaces newly published CodeQL queries against
    # otherwise-unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-latest   # CodeQL CLI has no arm64 build; build-mode none needs no compile
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          languages: c-cpp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          category: "/language:c-cpp"
