# CodeQL static security analysis for AlpacaBridge (C++).
#
# Complements the manual `security-review` workflow with automated scanning on
# every PR and a weekly scheduled sweep (catches advisories published against
# code that hasn't changed). Like the build gate, this runs on GitHub's native
# arm64 runner because the project only configures on aarch64. We scan the
# vendor-neutral core (ALPACACORE_ENABLE_ALL_VENDORS=OFF): the goal is to find
# issues in code we author, not in the vendored SDK trees.

name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 06:00 UTC — surfaces newly published CodeQL queries against
    # otherwise-unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            g++ \
            libusb-1.0-0-dev \
            libudev-dev \
            libgpiod-dev \
            nlohmann-json3-dev \
            libcurl4-openssl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build (vendor-neutral core)
        env:
          ALPACACORE_ENABLE_ALL_VENDORS: "OFF"
          ALPACABRIDGE_ENABLE_VCPKG: "OFF"
        run: |
          cmake -S AlpacaCore -B AlpacaCore/build \
            -DALPACACORE_BUILD_TESTS=ON \
            -DALPACACORE_ENABLE_ALL_VENDORS=OFF
          cmake --build AlpacaCore/build --parallel "$(nproc)"
          cmake -S AlpacaHTTP -B AlpacaHTTP/build \
            -DALPACAHTTP_BUILD_TESTS=ON \
            -DALPACACORE_ENABLE_ALL_VENDORS=OFF
          cmake --build AlpacaHTTP/build --parallel "$(nproc)"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d77b13a0df3134d64a457ea9003f600b09fa1c8a  # v3
        with:
          category: "/language:c-cpp"
