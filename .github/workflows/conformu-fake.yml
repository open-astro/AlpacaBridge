# Hardware-free ConformU against the drivers' fakes (issues #1637, #2078).
#
# This used to be a job in ci.yml that ran on every PR (20 to 21 minutes on
# the arm64 runner, measured over 15 CI runs). It now runs only when a PR
# touches a file that can change a run row's Alpaca answers (the `paths:` list
# below), and then only the rows that file reaches (the `runs` job), nightly
# on main, and on demand. Since #2078 the server
# and the run script are generic: scripts/run_fake_conformu.sh walks every
# `run` row of scripts/conformu_fake_runs.tsv (the Sky-Watcher UDP mount and
# serial motor board since slice 2, five focusers since slice 3, three filter
# wheels since slice 4, two cameras since slice 5, three rotators, the Gemini
# Pro flat panel, the OnStepX, iOptron iMate, Gemini PDH and ToupTek StellaVita
# switches and the remotealpaca ObservingConditions since slice 6; a row runs
# only when its fake can pass ConformU on merit, and every other roster row is
# pending with its reason),
# one matrix job per row,
# and check 30 of scripts/check_docs_drift.py keeps that list in step with
# kFakeConnectableRoster. The paths list is the
# fake_conformu_server target's own sources and the headers they include
# (found by a depfile sweep of the built target), the run rows' drivers and
# fakes, plus the shared device interfaces and HTTP layers the answers pass
# through, and the run script with the
# report checker that decides whether the run passes. It leaves out on purpose the other
# device types, the other vendors' *_schema.cpp and *_fields.h files and
# AlpacaHTTP/src/discovery/**: they are compiled into the server but cannot
# change the telescope's answers. It stays out of nightly-build.yml on
# purpose: a ConformU flake must not stop the nightly .deb. A red nightly run
# opens an issue through scheduled-failure.yml.
#
# The report is fake evidence, never hardware validation (see the job comment).

name: ConformU fake

on:
  pull_request:
    paths:
      # The drivers of the run rows (the `runs` job picks the rows a PR's
      # files reach), their wrappers and catalog descriptors.
      - "AlpacaCore/src/vendors/skywatcher/**"
      - "AlpacaCore/include/alpacacore/vendor/skywatcher/**"
      - "AlpacaCore/src/vendors/zwo/**"
      - "AlpacaCore/include/alpacacore/vendor/zwo/**"
      - "AlpacaCore/src/vendors/onstep/**"
      - "AlpacaCore/include/alpacacore/vendor/onstep/**"
      - "AlpacaCore/src/vendors/ioptron/**"
      - "AlpacaCore/include/alpacacore/vendor/ioptron/**"
      - "AlpacaCore/src/vendors/qhy/**"
      - "AlpacaCore/include/alpacacore/vendor/qhy/**"
      - "AlpacaCore/src/vendors/playerone/**"
      - "AlpacaCore/include/alpacacore/vendor/playerone/**"
      - "AlpacaCore/src/vendors/touptek/**"
      - "AlpacaCore/include/alpacacore/vendor/touptek/**"
      - "AlpacaCore/src/vendors/gemini/**"
      - "AlpacaCore/include/alpacacore/vendor/gemini/**"
      - "AlpacaCore/src/vendors/gphoto/**"
      - "AlpacaCore/include/alpacacore/vendor/gphoto/**"
      - "scripts/build_bundled_gphoto.sh"
      - "AlpacaCore/src/vendors/remotealpaca/**"
      - "AlpacaCore/include/alpacacore/vendor/remotealpaca/**"
      # The fakes, clocks and ConformU factories that fake_conformu_server
      # includes.
      - "AlpacaCore/tests/fake_skywatcher_*.h"
      - "AlpacaCore/tests/skywatcher_fake_clock.h"
      - "AlpacaCore/tests/conformu_skywatcher_factory.h"
      - "AlpacaCore/tests/conformu_focuser_factories.h"
      - "AlpacaCore/tests/fake_zwo_eaf_sdk.h"
      - "AlpacaCore/tests/fake_mount_server.h"
      - "AlpacaCore/tests/onstep_controller_model.h"
      - "AlpacaCore/tests/conformu_telescope_factories.h"
      - "AlpacaCore/tests/fake_ioptron_mount.h"
      - "AlpacaCore/tests/fake_mount_motion_model.h"
      - "AlpacaCore/tests/fake_ioptron_ieaf.h"
      - "AlpacaCore/tests/fake_ioptron_ifr.h"
      - "AlpacaCore/tests/fake_qhy_qfocuser.h"
      - "AlpacaCore/tests/conformu_filterwheel_factories.h"
      - "AlpacaCore/tests/fake_zwo_efw_sdk.h"
      - "AlpacaCore/tests/fake_qhy_cfw3.h"
      - "AlpacaCore/tests/fake_playerone_pw_sdk.h"
      - "AlpacaCore/tests/conformu_camera_factories.h"
      - "AlpacaCore/tests/conformu_rotator_factories.h"
      - "AlpacaCore/tests/conformu_covercalibrator_factories.h"
      - "AlpacaCore/tests/fake_zwo_caa_sdk.h"
      - "AlpacaCore/tests/fake_gemini_flatpanel.h"
      - "AlpacaCore/tests/conformu_switch_factories.h"
      - "AlpacaCore/tests/fake_ioptron_gpio.h"
      - "AlpacaCore/tests/fake_gemini_pdh.h"
      - "AlpacaCore/tests/fake_touptek_powerbox_sdk.h"
      - "AlpacaCore/tests/fake_iguider_v4l2.h"
      - "AlpacaCore/tests/locked_iguider_v4l2.h"
      - "AlpacaCore/tests/fake_gphoto_sdk.h"
      - "AlpacaCore/tests/locked_gphoto_sdk.h"
      - "AlpacaCore/tests/fake_raw_decoder.h"
      - "AlpacaCore/tests/conformu_observingconditions_factories.h"
      - "AlpacaCore/tests/fake_http_client.h"
      - "AlpacaCore/tests/alpaca_upstream_script.h"
      - "AlpacaCore/tests/fake_pty_write.h"
      - "AlpacaCore/tests/connect_hold_gate.h"
      - "AlpacaCore/tests/fake_task_clock.h"
      # The test-only server target and the CMake that builds it.
      - "AlpacaHTTP/tests/fake_conformu_server.cpp"
      - "AlpacaHTTP/CMakeLists.txt"
      - "AlpacaCore/CMakeLists.txt"
      # The device interfaces of the run rows and the core code behind them.
      - "AlpacaCore/include/alpacacore/telescope_driver.h"
      - "AlpacaCore/include/alpacacore/focuser_driver.h"
      - "AlpacaCore/include/alpacacore/filterwheel_driver.h"
      - "AlpacaCore/include/alpacacore/camera_driver.h"
      - "AlpacaCore/include/alpacacore/rotator_driver.h"
      - "AlpacaCore/include/alpacacore/covercalibrator_driver.h"
      - "AlpacaCore/include/alpacacore/switch_driver.h"
      - "AlpacaCore/include/alpacacore/observingconditions_driver.h"
      - "AlpacaCore/include/alpacacore/alpaca_defs.h"
      - "AlpacaCore/include/alpacacore/alpaca_errors.h"
      - "AlpacaCore/include/alpacacore/alpacadriver.h"
      - "AlpacaCore/include/alpacacore/async_connectable.h"
      - "AlpacaCore/include/alpacacore/device_capabilities.h"
      - "AlpacaCore/include/alpacacore/device_registry.h"
      - "AlpacaCore/src/core/**"
      - "AlpacaCore/src/management/**"
      - "AlpacaCore/include/alpacacore/managementdriver.h"
      - "AlpacaCore/include/alpacacore/version.h"
      # Shared helpers the driver includes (link health, serial I/O, motion
      # limits, state snapshot, task clock) and the catalog it registers in.
      - "AlpacaCore/include/alpacacore/util/**"
      - "AlpacaCore/include/alpacacore/catalog/**"
      - "AlpacaCore/src/catalog/**"
      # The HTTP layer every telescope request passes through.
      - "AlpacaHTTP/src/http/**"
      - "AlpacaHTTP/src/core/**"
      - "AlpacaHTTP/src/util/**"
      - "AlpacaHTTP/include/alpacahttp/**"
      # The run script, the run list it walks and the roster that list is
      # pinned to (a roster change can change what runs), the report checker
      # whose check_text() (or, for a PR-profile telescope row,
      # check_pr_profile_run()) decides whether a run passes, the committed fake
      # report and this workflow.
      - "scripts/run_fake_conformu.sh"
      - "scripts/conformu_fake_runs.tsv"
      - "AlpacaCore/tests/contract_sweep.h"
      - "scripts/check_conformu_reports.py"
      - "AlpacaCore/conformu/*/Fake/**"
      - ".github/workflows/conformu-fake.yml"
  schedule:
    - cron: "47 4 * * *"   # after nightly-build.yml (03:17), before osv-scan.yml (05:23)
  workflow_dispatch:

concurrency:
  group: conformu-fake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runs:
    # The run rows of scripts/conformu_fake_runs.tsv as the matrix of the job below (issue #2078 slice 2). One job per
    # row, in parallel: a full telescope row takes about 20 minutes of ConformU on the arm64 runner and the build 42 s
    # (measured), so walking the rows in one job would outgrow its bound with the second row.
    name: List the fake ConformU run rows
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.list.outputs.rows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the PR merge commit and its base parent, for the changed files

      - name: Changed files (pull requests only)
        # A pull_request run checks out the merge commit, whose first parent is the base.
        if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"

      - name: List the run rows
        id: list
        # vendor/deviceType/fakeHeader keys the row for the run script; the CMake options build its vendor (a catalog
        # vendor that another option builds, such as ifr under iOptron, is mapped); the slug names its artifact (the
        # Sky-Watcher UDP row keeps conformu-fake-skywatcher). On a pull request a row runs when the PR changes a
        # shared file (a file the paths filter above lists that is not one vendor's: the core, the HTTP layer, the
        # server, the run list, this workflow) or that row's own vendor sources, fakes or reports. A file the paths
        # filter does not list (a changelog fragment, docs, a test case) selects nothing. The nightly and dispatched
        # runs run every row. Each telescope row is ~21 minutes, so a focuser-only PR does not pay for the mounts.
        run: |
          set -euo pipefail
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          BUILT_BY = {"ifr": ["IOPTRON"], "iguider": ["IOPTRON"], "altair": ["TOUPTEK", "ALTAIR"]}
          # Vendors whose build requires libgpiod >= 2.0, which the runner's apt does not ship (iOptron's is optional).
          NEEDS_GPIOD = {"zwo"}
          # The iMate and StellaVita switch rows build their power box only with libgpiod; the vendor's other rows do not.
          NEEDS_GPIOD_SWITCH = {"ioptron", "touptek"}
          # Vendors that link the bundled libgphoto2 (scripts/build_bundled_gphoto.sh), never the distro's.
          NEEDS_GPHOTO = {"gphoto"}
          SOURCE_DIRS = {"ifr": ["ioptron"], "iguider": ["ioptron"], "altair": ["altair", "touptek"]}
          REPORT_DIRS = {"skywatcher": "Sky-Watcher", "zwo": "ZWO", "onstep": "OnStep", "ioptron": "iOptron",
                         "ifr": "iOptron", "qhy": "QHY", "playerone": "Player One",
                         "iguider": "iOptron", "gphoto": "GPhoto", "gemini": "Gemini", "touptek": "ToupTek",
                         "altair": "Altair", "remotealpaca": "Remote Alpaca"}
          # Test files that serve one vendor's rows only, beside its fake_<vendor>_*.h headers. A fake_*.h that is not
          # named for a vendor counts as the vendor of the run row that names it: fake_mount_server.h is OnStep's
          # only while the ZWO, Celestron, SynScan and OnStep telescope rows that also use it stay pending.
          VENDOR_FILES = {"AlpacaCore/tests/onstep_controller_model.h": "onstep",
                          "AlpacaCore/tests/conformu_telescope_factories.h": "ioptron",
                          "AlpacaCore/tests/fake_mount_motion_model.h": "ioptron",
                          "AlpacaCore/tests/conformu_skywatcher_factory.h": "skywatcher",
                          "AlpacaCore/tests/skywatcher_fake_clock.h": "skywatcher",
                          "AlpacaCore/tests/locked_iguider_v4l2.h": "ioptron",
                          "AlpacaCore/tests/locked_gphoto_sdk.h": "gphoto",
                          "AlpacaCore/tests/fake_raw_decoder.h": "gphoto",
                          "scripts/build_bundled_gphoto.sh": "gphoto",
                          "AlpacaCore/tests/conformu_observingconditions_factories.h": "remotealpaca",
                          "AlpacaCore/tests/alpaca_upstream_script.h": "remotealpaca"}
          changed_path = os.path.join(os.environ["RUNNER_TEMP"], "changed.txt")
          changed = None
          if os.path.exists(changed_path):
              with open(changed_path, encoding="utf-8") as f:
                  changed = [p.strip() for p in f if p.strip()]

          def path_filter():
              # The on.pull_request.paths globs of this workflow, as regular expressions (** spans directories).
              globs, inside = [], False
              with open(".github/workflows/conformu-fake.yml", encoding="utf-8") as f:
                  for line in f:
                      if line.strip() == "paths:":
                          inside = True
                      elif inside and line.strip().startswith("- "):
                          globs.append(line.strip()[2:].strip().strip('"'))
                      elif inside and line.strip() and not line.strip().startswith("#"):
                          break
              def to_regex(glob):
                  out = ""
                  for part in re.split(r"(\*\*|\*)", glob):
                      out += ".*" if part == "**" else "[^/]*" if part == "*" else re.escape(part)
                  return re.compile(out + "$")
              return [to_regex(g) for g in globs]

          FILTER = path_filter()

          def filtered(path):
              return any(r.match(path) for r in FILTER)

          def vendor_specific(path):
              return (path in VENDOR_FILES
                      or path.startswith(("AlpacaCore/src/vendors/", "AlpacaCore/include/alpacacore/vendor/",
                                          "AlpacaCore/conformu/"))
                      or (path.startswith("AlpacaCore/tests/fake_") and path != "AlpacaCore/tests/fake_pty_write.h"
                          and path != "AlpacaCore/tests/fake_task_clock.h"))

          shared_change = changed is None or any(filtered(p) and not vendor_specific(p) for p in changed)

          def reaches(vendor, fake):
              dirs = SOURCE_DIRS.get(vendor, [vendor])
              mine = ["AlpacaCore/src/vendors/%s/" % d for d in dirs]
              mine += ["AlpacaCore/include/alpacacore/vendor/%s/" % d for d in dirs]
              mine += ["AlpacaCore/conformu/%s/Fake/" % REPORT_DIRS.get(vendor, vendor)]
              mine += ["AlpacaCore/tests/fake_%s_" % d for d in dirs]  # the vendor's other fakes (a shared board)
              return any(p.startswith(tuple(mine)) or p == "AlpacaCore/tests/" + fake or VENDOR_FILES.get(p) in dirs
                         for p in changed)

          rows = []
          with open("scripts/conformu_fake_runs.tsv", encoding="utf-8") as f:
              for line in f:
                  if not line.strip() or line.startswith("#"):
                      continue
                  cells = line.rstrip("\n").split("\t")
                  if cells[0] == "vendor" or cells[3] != "run":
                      continue
                  vendor, dtype, fake = cells[0], cells[1], cells[2]
                  if not shared_change and not reaches(vendor, fake):
                      continue
                  stem = fake[:-2] if fake.endswith(".h") else fake
                  legacy = (vendor, dtype, fake) == ("skywatcher", "telescope", "fake_skywatcher_mount.h")
                  rows.append({
                      "key": "%s/%s/%s" % (vendor, dtype, fake),
                      "options": " ".join("-DALPACACORE_ENABLE_%s=ON" % o
                                          for o in BUILT_BY.get(vendor, [vendor.upper()])),
                      "slug": vendor if legacy else "%s-%s-%s" % (vendor, dtype, stem),
                      "gpiod": vendor in NEEDS_GPIOD or (dtype == "switch" and vendor in NEEDS_GPIOD_SWITCH),
                      "gphoto": vendor in NEEDS_GPHOTO,
                  })
          print("rows=" + json.dumps(rows))
          PY

  conformu-fake:
    # Hardware-free ConformU: one `run` row of scripts/conformu_fake_runs.tsv per
    # job (the rows the `runs` job lists), served by the test-only fake_conformu_server
    # (not installed or packaged). Each report is a CI artifact under
    # <Vendor>/Fake/ ("FAKE REPORT:" first line) and a copy is committed at the
    # row's reportPath under AlpacaCore/conformu/. It is never hardware
    # validation.
    name: ConformU against ${{ matrix.row.key }} (arm64)
    needs: runs
    if: needs.runs.outputs.rows != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.runs.outputs.rows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            g++ \
            meson \
            pkg-config \
            libltdl-dev \
            libexif-dev \
            libjpeg-dev \
            libraw-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libhidapi-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Build libgpiod v2 from source (rows whose vendor needs it)
        # The ZWO build needs libgpiod >= 2.0 and the runner ships 1.6. The pin is read from ci.yml, the one place it
        # lives, as nightly-build.yml does.
        if: matrix.row.gpiod
        run: |
          set -euo pipefail
          gpiod_ver="$(sed -n 's/^  LIBGPIOD_VER: "\(.*\)"$/\1/p' .github/workflows/ci.yml)"
          sha="$(sed -n 's/^  LIBGPIOD_SHA256: "\(.*\)"$/\1/p' .github/workflows/ci.yml)"
          if [ -z "${gpiod_ver}" ] || [ -z "${sha}" ]; then
            echo "libgpiod pin not found in ci.yml"
            exit 1
          fi
          cp "AlpacaCore/external/libgpiod/libgpiod-${gpiod_ver}.tar.xz" "$RUNNER_TEMP/libgpiod.tar.xz"
          echo "${sha}  $RUNNER_TEMP/libgpiod.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/libgpiod"
          tar -xf "$RUNNER_TEMP/libgpiod.tar.xz" -C "$RUNNER_TEMP/libgpiod" --strip-components=1
          cd "$RUNNER_TEMP/libgpiod"
          meson setup build --prefix=/usr/local --libdir=lib -Dauto_features=disabled
          meson compile -C build
          sudo meson install -C build --no-rebuild
          sudo ldconfig

      - name: Build the bundled libgphoto2 (rows whose vendor links it)
        # The GPhoto driver links the vendored libgphoto2 in its own prefix, never the distro's (nightly-build.yml's
        # step); libraw and the configure dependencies come from apt above.
        if: matrix.row.gphoto
        run: |
          set -euo pipefail
          sudo scripts/build_bundled_gphoto.sh --build-dir "${RUNNER_TEMP}/gphoto-src" --jobs "$(nproc)"

      - name: Build the fake server (core + HTTP, the row's vendor only)
        env:
          VENDOR_OPTIONS: ${{ matrix.row.options }}
        run: |
          set -euo pipefail
          read -r -a vendor_options <<< "$VENDOR_OPTIONS"
          cmake -S AlpacaHTTP -B AlpacaHTTP/build \
            -DALPACAHTTP_BUILD_TESTS=ON \
            -DALPACACORE_ENABLE_ALL_VENDORS=OFF \
            "${vendor_options[@]}"
          cmake --build AlpacaHTTP/build --target fake_conformu_server --parallel "$(nproc)"

      - name: Restore the ConformU tarball
        # Every row downloaded the release asset, and a 504 from GitHub failed the
        # row with nothing tested. The key is the asset's sha256: change it with
        # the URL and checksum below.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/conformu-dl
          key: conformu-tarball-98ae1853e61832e4ed33270c70bbbe442dc7d698756214b4bb294803639482ba

      - name: Install ConformU 4.6.0-rc.1 (pinned release, sha256-checked)
        # The standard in .github/instructions/testing.instructions.md; the same
        # asset and checksum as /conformu step 2g. A cache miss downloads it, with
        # retries for a transient 5xx; the checksum is checked either way.
        run: |
          set -euo pipefail
          mkdir -p ~/conformu-dl "$RUNNER_TEMP/conformu"
          if [ ! -f ~/conformu-dl/cu.tar.gz ]; then
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o ~/conformu-dl/cu.tar.gz 'https://github.com/ASCOMInitiative/ConformU/releases/download/v4.6.0-rc.1/conformu.4.6.0.linux-arm64.tar.gz'
          fi
          cd ~/conformu-dl
          echo '98ae1853e61832e4ed33270c70bbbe442dc7d698756214b4bb294803639482ba  cu.tar.gz' | sha256sum -c -
          tar xzf cu.tar.gz -C "$RUNNER_TEMP/conformu"
          cd "$RUNNER_TEMP/conformu"
          chmod +x conformu
          ./conformu --version | tail -1

      - name: Run ConformU against the row's fake
        # A full-profile row fails when ConformU exits non-zero or its log lacks
        # the clean-pass line or shows a response-time finding (the checker's own
        # rules). On a pull request a telescope row runs the PR profile (issue
        # #2568): no extended rate-offset or pulse-guide tests, passed by
        # check_pr_profile_run(). The nightly and dispatched runs keep the full
        # test, and only their reports are committed (check_text() refuses a
        # PR-profile report).
        env:
          ROW_KEY: ${{ matrix.row.key }}
          FAKE_CONFORMU_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        run: |
          scripts/run_fake_conformu.sh \
            AlpacaHTTP/build/fake_conformu_server \
            "$RUNNER_TEMP/conformu/conformu" \
            "$RUNNER_TEMP/fake-conformu" \
            scripts/conformu_fake_runs.tsv \
            "$ROW_KEY"

      - name: Upload the ConformU log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conformu-fake-${{ matrix.row.slug }}
          path: ${{ runner.temp }}/fake-conformu/
          if-no-files-found: warn
