# AlpacaBridge CI
#
# AlpacaBridge is **Linux arm64 only** (AGENTS.md "Target Architecture";
# CMake / debian/rules / build scripts hard-fail on non-arm64). Every job here
# runs on GitHub's native arm64 runner (`ubuntu-24.04-arm`, free for public
# repos) — an x86_64 runner cannot even configure the project, and the text-only
# checks (format/unicode/shellcheck) produce identical results on any arch, so
# we keep a single-architecture fleet. (CodeQL is the lone forced exception and
# lives in its own workflow: its CLI has no arm64 build.)
#
# Jobs:
#   build-test     build vendor-neutral core + run unit tests (the base gate),
#                  in a debian:trixie container (the distribution we ship for)
#   build-vendors-shard  stage in-tree vendor SDK .so libs, build with all
#                  vendors ON, instrumented for gcov, and run every third test
#                  (three shards); each uploads its raw coverage JSON
#   build-vendors  pass only when all three shards passed; merge their coverage
#                  into per-component + combined line coverage in the job
#                  summary, HTML/JSON artifact (no threshold)
#   sanitizers     build+test under AddressSanitizer + UndefinedBehaviorSanitizer
#   sanitizers-tsan  build all-vendors under ThreadSanitizer + run the [stress]
#                  connect/disconnect/operate concurrency suite (issue #101),
#                  plus [stress-guard] (the harness's own self-tests, issue #322)
#   format         clang-format check, PR changed lines only
#   clang-tidy     clang-tidy static analysis, PR changed lines only
#   package-deb    build the .deb in debian:trixie, install it, run
#                  scripts/check_bundled_gphoto.sh (bundled libgphoto2 loader path)
#   static-checks  the text, script and JavaScript gates, one step each: the
#                  Unicode scan, docs drift and the scripts' self-tests, the
#                  connect-error, serial-port, layering, stress-registration,
#                  contract-sweep and ConformU-report checks, ShellCheck (plus
#                  ci_preflight.sh --self-test), and node --check / node --test
#   cppcheck       second C/C++ static-analysis engine, PR changed files only
#   zizmor         security audit of these GitHub Actions workflows
#
# Where each job runs: every job runs on a pull_request push except
# sanitizers-tsan and package-deb, which skip a PR into main: main's merge queue
# (merge_group) runs them on the merge commit before it lands, so they gate the
# merge without running on every push. They still run on a PR into stable/**
# (no queue there), on a push to main or stable/**, and on workflow_dispatch
# (`gh workflow run ci.yml --ref <branch>` runs them on a PR branch in this
# repository before it is queued; a fork PR's branch is not here, so the queue
# is its first run). format, clang-tidy, static-checks' ConformU step and cppcheck's check step run
# on pull_request only: they diff against $GITHUB_BASE_REF, which a merge_group
# run does not set, and a job skipped by its `if:` still satisfies a required
# check.
#
# The vendor-neutral build (ALPACACORE_ENABLE_ALL_VENDORS=OFF) does not depend
# on the bundled vendor SDK .so / firmware blobs; the vendor-ON job stages
# those libraries from the in-tree external/ trees before building.

name: CI

on:
  pull_request:
  # The merge queue builds each queued group's merge commit here before it lands.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - "stable/**"
  workflow_dispatch:

# A newer push to the same ref makes in-flight runs obsolete — cancel them so
# we don't burn two arm64 builds racing each other. A merge-queue run is never
# cancelled here: each queued group has its own ref, and the queue itself
# cancels a group it drops, so cancelling could only kill a run it waits on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Single source of truth for the vendored libgpiod build dependency — the
# build-vendors-shard, sanitizers-tsan and clang-tidy jobs consume these,
# so a version bump can't skew them (tarball + README in AlpacaCore/external/libgpiod/).
env:
  LIBGPIOD_VER: "2.2.4"
  LIBGPIOD_SHA256: "13207176b0eb9b3e0f02552d5f49f5a6a449343ce47416158bb484d9d3019592"

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (arm64)
    runs-on: ubuntu-24.04-arm
    # Debian 13 (trixie), the distribution AlpacaBridge ships for: the core
    # suite builds with trixie's gcc 14, glibc and Catch2, as on a user's SBC,
    # not with the Ubuntu runner's gcc 13. package-deb builds the .deb here too,
    # but runs no tests.
    container: debian:trixie
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        # Before the checkout: actions/checkout needs git in the container,
        # and the cache steps use zstd. python3 is for the beta VERSION check
        # (scripts/check_beta_configure.sh), which the Ubuntu runner had
        # preinstalled. The container runs as root, so no sudo. catch2 is required: without it AlpacaCore/tests/CMakeLists.txt
        # returns early, ctest finds no tests and exits 0, and this job
        # green-lights while running none of the core suite (issue #586).
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            zstd \
            python3 \
            build-essential \
            cmake \
            ccache \
            g++ \
            catch2 \
            pkg-config \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libgpiod-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.x pinned (immutable ref)
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          grep PRETTY_NAME /etc/os-release
          cmake --version
          g++ --version

      - name: Restore the compiler cache
        # ccache keyed per job, because each job compiles with its own flags. Only
        # a push to main or stable/** saves it (the save step below), so a pull
        # request reuses its base branch's cache and never writes one. The
        # directory is ccache's default, outside the build tree run_all_tests.sh
        # deletes on entry. The prefix names trixie: objects from the Ubuntu
        # runner's gcc 13 are no use to gcc 14.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-build-test-trixie-${{ github.sha }}
          restore-keys: ccache-build-test-trixie-

      - name: Create the unprivileged test user
        # The suite runs as an ordinary user, as on the Ubuntu runner and on an
        # SBC. The container runs as root, and root ignores file modes, so a case
        # that makes a directory read-only to make a write fail (test_routing's
        # #1473 case; test_software_update, test_serial_by_id_scan and
        # test_connection_resolver also set modes) would see the write succeed.
        # The checkout and the restored compiler cache belong to root, so they
        # are handed to the user.
        run: |
          set -euo pipefail
          useradd --create-home builder
          mkdir -p "$HOME/.cache/ccache"
          chown -R builder: "$GITHUB_WORKSPACE" "$HOME/.cache/ccache"

      - name: Build + run tests (vendor-neutral core)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          ALPACACORE_ENABLE_ALL_VENDORS: "OFF"
        # As the test user. runuser keeps this step's environment except HOME,
        # SHELL, USER and LOGNAME, which it resets for the user, so CCACHE_DIR
        # must stay explicit: it points at root's cache directory, which the
        # save step reads.
        run: runuser -u builder -- env CCACHE_DIR="$HOME/.cache/ccache" ./run_all_tests.sh

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-build-test-trixie-${{ github.sha }}

      - name: Check the beta VERSION split
        # Pins the ~betaN split both CMakeLists share
        # (AlpacaCore/cmake/AlpacaBridgeVersion.cmake, docs/beta-channel.md)
        # whatever the checkout's VERSION is: cmake -P over sample values, no
        # configure, no compile.
        run: scripts/check_beta_configure.sh

  build-vendors-shard:
    # The all-vendors suite runs once, instrumented for coverage, split across
    # three runners: each shard builds the whole tree (ccache makes the build
    # about 1.5 min) and runs every third test (`ctest -I <shard>,,3`, via
    # CTEST_SHARD in run_all_tests.sh), so the slow driver cases, which sit
    # next to each other in test-number order, are spread over the three. One
    # runner took about 11.5 min of ctest for about 88 min of test time; the
    # cases wait on fake hardware in real time, so a third of them per runner
    # also means less contention for the ones that measure time. Each shard
    # uploads its raw gcovr JSON; build-vendors below merges the three into
    # the report. The report is informational: no --fail-under threshold.
    name: Build + test (all vendors, arm64, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end, so one red shard does not hide another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        # NOTE: libgpiod-dev is intentionally omitted — the ubuntu-24.04 runner
        # ships libgpiod 1.6, but the ZWO switch/GPIO drivers need >= 2.0. We
        # build v2 from source in the next step instead (matches the Debian
        # Trixie production target).
        # catch2 is required: without it AlpacaCore/tests/CMakeLists.txt
        # returns early, ctest finds no tests and exits 0, and this job
        # green-lights while running none of the core suite (issue #586).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            g++ \
            catch2 \
            pkg-config \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libhidapi-dev \
            libltdl-dev \
            libexif-dev \
            libjpeg-dev \
            libraw-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            gcovr

      - name: Restore the libgpiod and libgphoto2 builds
        # Both build from vendored, checksum-pinned tarballs, so a build stays
        # the same until a pin or the gphoto script changes, and the key holds
        # both. A hit skips the two configure-and-make runs (about 35 to 45 s)
        # in every job that needs them: the all-vendors shards, TSan and
        # clang-tidy. Both install into a staging tree, copied into place below.
        id: deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/deps-stage
          key: deps-gpiod-${{ env.LIBGPIOD_VER }}-${{ env.LIBGPIOD_SHA256 }}-gphoto-${{ hashFiles('scripts/build_bundled_gphoto.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build libgpiod v2 and the bundled libgphoto2
        # On a cache miss only. libgpiod: the ZWO switch drivers need >= 2.0
        # (gpiod_chip_request_lines), which the runner's apt does not provide;
        # the tarball is vendored (AlpacaCore/external/libgpiod/, see the README
        # there: kernel.org removed old point releases) and its sha256 pin
        # (workflow env) guards against corruption. libgphoto2: the gphoto
        # driver links the vendored copy, never the distro one; the script
        # checks its own pin and, with --destdir, needs no root. Its build tree
        # goes under RUNNER_TEMP, out of the checkout.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          stage="${HOME}/deps-stage"
          cp "AlpacaCore/external/libgpiod/libgpiod-${LIBGPIOD_VER}.tar.xz" /tmp/libgpiod.tar.xz
          echo "${LIBGPIOD_SHA256}  /tmp/libgpiod.tar.xz" \
            | sha256sum -c -
          mkdir -p /tmp/libgpiod
          tar -xf /tmp/libgpiod.tar.xz -C /tmp/libgpiod --strip-components=1
          (
            cd /tmp/libgpiod
            ./configure --prefix=/usr/local --enable-tools=no --enable-bindings-cxx=no
            make -j"$(nproc)"
            make install DESTDIR="${stage}"
          )
          scripts/build_bundled_gphoto.sh --destdir "${stage}" --build-dir "${RUNNER_TEMP}/gphoto-src" --jobs "$(nproc)"

      - name: Install libgpiod v2 and the bundled libgphoto2
        # libgpiod into /usr/local, where CMake's find_library picks it up ahead
        # of any system copy; libgphoto2 into /usr/lib/alpacabridge/libgphoto2,
        # where the executables' rpath finds it.
        run: |
          set -euo pipefail
          sudo cp -a --no-preserve=ownership "${HOME}/deps-stage/." /
          sudo ldconfig

      - name: Stage vendor SDK shared libraries
        # Mirrors run_system_setup() in build_and_run.sh: copy the in-tree
        # arm64 vendor .so files onto the loader path so the vendor-ON build
        # links. Firmware blobs / udev rules are device-runtime concerns and
        # are not needed to build or run the unit tests.
        run: |
          set -euo pipefail
          core="AlpacaCore/external"
          libs=(
            "$core/ZWO/ASI_Camera_SDK/lib/linux/armv8/libASICamera2.so"
            "$core/SVBONY/lib/armv8/libSVBCameraSDK.so"
            "$core/ToupTek/toupcamsdk.20260519/linux/arm64/glibc/libtoupcam.so"
            "$core/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.1/lib/arm64/libPlayerOneCamera.so"
            "$core/PlayerOne/PlayerOne_FilterWheel_SDK_Linux_V1.2.3/lib/arm64/libPlayerOnePW.so"
            "$core/QHY/sdk_linux_arm64_26.07.28/usr/local/lib/libqhyccd.so"
          )
          for lib in "${libs[@]}"; do
            if compgen -G "${lib}*" > /dev/null; then
              echo "Staging $(basename "$lib")*"
              sudo cp -a "${lib}"* /usr/local/lib/
            else
              echo "WARNING: ${lib}* not found — skipping"
            fi
          done
          sudo ldconfig

      - name: Wrap the compilers for -fprofile-update=atomic
        # See the script: ccache cannot cache a compile that carries the option.
        run: .github/scripts/coverage-compilers.sh

      - name: Restore the compiler cache
        # Keyed per job; see the build-test job. A new prefix, because the
        # objects are now built with --coverage.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-all-vendors-coverage-${{ github.sha }}
          restore-keys: ccache-all-vendors-coverage-

      - name: Build + run tests with coverage (all vendors)
        # CMake takes CXXFLAGS / LDFLAGS on a fresh configure and
        # run_all_tests.sh wipes its build tree first. -fprofile-update=atomic
        # comes from the compiler wrappers (CC/CXX), not CXXFLAGS.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          ALPACACORE_ENABLE_ALL_VENDORS: "ON"
          CXXFLAGS: "--coverage -O0 -g"
          LDFLAGS: "--coverage"
          CTEST_SHARD: ${{ matrix.shard }}/3
        # Zeroed first: the statistics live in the cached directory, so they
        # would otherwise add up every run since the cache was first saved.
        run: |
          ccache --zero-stats
          ./run_all_tests.sh

      - name: Compiler cache statistics
        # --verbose lists why calls were uncacheable.
        if: always()
        run: ccache --show-stats --verbose

      - name: Save the compiler cache
        # Every shard compiles the same tree, so one of them saves it: a second
        # save of the same key would be refused.
        if: always() && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-all-vendors-coverage-${{ github.sha }}

      - name: Collect this shard's coverage data
        # Over the one tree run_all_tests.sh builds: AlpacaHTTP/build holds
        # AlpacaCore as a subdirectory, and both suites write the same .gcda
        # files there (issue #1251). Raw JSON only: build-vendors merges the
        # three shards' files (gcovr -a adds the hit counts) and writes the
        # reports.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p coverage-raw
          gcovr --root . -j "$(nproc)" \
            --exclude '.*/tests/' \
            --exclude '.*/external/' \
            --exclude '.*/examples/' \
            --exclude '.*/build[^/]*/' \
            --gcov-ignore-parse-errors=all \
            --filter 'AlpacaCore/(src|include)/' \
            --filter 'AlpacaHTTP/(src|include)/' \
            --json "coverage-raw/shard-${SHARD}.json" \
            AlpacaHTTP/build

      - name: Upload this shard's coverage data
        # Kept a week: re-running one failed shard re-runs build-vendors, which
        # reads the other shards' files from the earlier attempt.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-raw-${{ matrix.shard }}
          path: coverage-raw/
          if-no-files-found: error
          retention-days: 7

  build-vendors:
    # The required check and the review bot's CI wait both name this job, so
    # it keeps the name the single all-vendors job had. It passes only when
    # all three shards passed: `!cancelled()` runs it after a failed shard
    # (to fail here), where a plain needs: would skip it, and a skipped job
    # satisfies a required check. A run cancelled by a newer push skips it.
    name: Build + test (all vendors, arm64)
    needs: build-vendors-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.build-vendors-shard.result }}
        run: |
          if [ "${SHARDS}" != "success" ]; then
            echo "::error::An all-vendors test shard did not pass (result: ${SHARDS}); see the shard jobs."
            exit 1
          fi

      - name: Checkout
        # gcovr reads the sources for the HTML report.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcovr

      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-raw-*
          path: coverage-raw
          merge-multiple: true

      - name: Generate coverage report
        # The shards ran gcov over their own trees with the same filters and
        # excludes; adding their JSON (-a) sums each line's hits, so this is the
        # report one runner running every test would write. The combined JSON
        # it writes feeds the two component reports.
        run: |
          set -euo pipefail
          mkdir -p coverage/html
          shards=(coverage-raw/shard-*.json)
          if [ "${#shards[@]}" -ne 3 ] || [ ! -f "${shards[0]}" ]; then
            echo "::error::expected three shard coverage files, found: ${shards[*]}"
            exit 1
          fi
          tracefiles=()
          for f in "${shards[@]}"; do tracefiles+=(-a "$f"); done
          gcovr --root . "${tracefiles[@]}" \
            --filter 'AlpacaCore/(src|include)/' \
            --filter 'AlpacaHTTP/(src|include)/' \
            --json coverage/combined-raw.json \
            --txt coverage/combined.txt \
            --json-summary-pretty --json-summary coverage/combined.json \
            --html-details coverage/html/index.html
          report() {
            local name="$1"
            shift
            gcovr --root . -a coverage/combined-raw.json "$@" \
              --txt "coverage/${name}.txt" \
              --json-summary-pretty --json-summary "coverage/${name}.json"
          }
          report alpacacore --filter 'AlpacaCore/(src|include)/'
          report alpacahttp --filter 'AlpacaHTTP/(src|include)/'
          cat coverage/combined.txt
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          rows = [("AlpacaCore", "alpacacore"), ("AlpacaHTTP", "alpacahttp"),
                  ("Combined", "combined")]
          print("## Line coverage (all vendors, arm64)\n")
          print("| Component | Lines covered | Lines total | Line % |")
          print("|---|---:|---:|---:|")
          totals = {}
          for label, name in rows:
              with open(f"coverage/{name}.json") as f:
                  s = json.load(f)
              totals[name] = s['line_total']
              print(f"| {label} | {s['line_covered']} | {s['line_total']} "
                    f"| {s['line_percent']:.1f} |")
          # The component reports are filtered from the combined JSON (gcovr
          # -a). The two filters are disjoint, so they must add up to the
          # combined total; if they do not, gcovr stopped applying --filter to
          # a tracefile and the component rows are wrong.
          if totals["alpacacore"] + totals["alpacahttp"] != totals["combined"]:
              raise SystemExit(f"component line totals {totals} do not add up")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (ASan + UBSan, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        # catch2 is required: without it AlpacaCore/tests/CMakeLists.txt
        # returns early, ctest finds no tests and exits 0, and this job
        # green-lights while running none of the core suite (issue #586).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            g++ \
            catch2 \
            pkg-config \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libgpiod-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Restore the compiler cache
        # Keyed per job; see the build-test job. Not `ccache-sanitizers-`: that
        # prefix also matches the TSan job's keys, and a restore by prefix takes
        # the newest match, so this job restored the TSan cache and missed every
        # compile (issue #1355; docs-drift check 20).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-

      - name: Build + run tests with sanitizers (vendor-neutral)
        # CMake seeds CMAKE_CXX_FLAGS / linker flags from CXXFLAGS / LDFLAGS on
        # a fresh configure, and run_all_tests.sh wipes its build tree first, so these
        # instrument the whole tree. -fno-sanitize-recover makes any detected
        # UB a hard test failure rather than a logged warning.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          ALPACACORE_ENABLE_ALL_VENDORS: "OFF"
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ./run_all_tests.sh

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}

  sanitizers-tsan:
    name: Sanitizers (TSan concurrency stress, arm64)
    # Skips a PR into main, where the merge queue runs it instead (see the
    # header): off the per-push PR loop, but still gating every merge.
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        # libgpiod-dev intentionally omitted (needs >= 2.0, built from source
        # below) — mirrors the build-vendors-shard job. catch2 is required: without
        # it the tests CMakeLists silently skips the suite and this job would
        # green-light while running nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            g++ \
            catch2 \
            pkg-config \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libhidapi-dev \
            libltdl-dev \
            libexif-dev \
            libjpeg-dev \
            libraw-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Restore the libgpiod and libgphoto2 builds
        # Both build from vendored, checksum-pinned tarballs, so a build stays
        # the same until a pin or the gphoto script changes, and the key holds
        # both. A hit skips the two configure-and-make runs (about 35 to 45 s)
        # in every job that needs them: the all-vendors shards, TSan and
        # clang-tidy. Both install into a staging tree, copied into place below.
        id: deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/deps-stage
          key: deps-gpiod-${{ env.LIBGPIOD_VER }}-${{ env.LIBGPIOD_SHA256 }}-gphoto-${{ hashFiles('scripts/build_bundled_gphoto.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build libgpiod v2 and the bundled libgphoto2
        # On a cache miss only. libgpiod: the ZWO switch drivers need >= 2.0
        # (gpiod_chip_request_lines), which the runner's apt does not provide;
        # the tarball is vendored (AlpacaCore/external/libgpiod/, see the README
        # there: kernel.org removed old point releases) and its sha256 pin
        # (workflow env) guards against corruption. libgphoto2: the gphoto
        # driver links the vendored copy, never the distro one; the script
        # checks its own pin and, with --destdir, needs no root. Its build tree
        # goes under RUNNER_TEMP, out of the checkout.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          stage="${HOME}/deps-stage"
          cp "AlpacaCore/external/libgpiod/libgpiod-${LIBGPIOD_VER}.tar.xz" /tmp/libgpiod.tar.xz
          echo "${LIBGPIOD_SHA256}  /tmp/libgpiod.tar.xz" \
            | sha256sum -c -
          mkdir -p /tmp/libgpiod
          tar -xf /tmp/libgpiod.tar.xz -C /tmp/libgpiod --strip-components=1
          (
            cd /tmp/libgpiod
            ./configure --prefix=/usr/local --enable-tools=no --enable-bindings-cxx=no
            make -j"$(nproc)"
            make install DESTDIR="${stage}"
          )
          scripts/build_bundled_gphoto.sh --destdir "${stage}" --build-dir "${RUNNER_TEMP}/gphoto-src" --jobs "$(nproc)"

      - name: Install libgpiod v2 and the bundled libgphoto2
        # libgpiod into /usr/local, where CMake's find_library picks it up ahead
        # of any system copy; libgphoto2 into /usr/lib/alpacabridge/libgphoto2,
        # where the executables' rpath finds it.
        run: |
          set -euo pipefail
          sudo cp -a --no-preserve=ownership "${HOME}/deps-stage/." /
          sudo ldconfig

      - name: Stage vendor SDK shared libraries
        # Mirrors the build-vendors-shard job: the vendor-ON build links the in-tree
        # arm64 vendor .so files from the loader path.
        run: |
          set -euo pipefail
          core="AlpacaCore/external"
          libs=(
            "$core/ZWO/ASI_Camera_SDK/lib/linux/armv8/libASICamera2.so"
            "$core/SVBONY/lib/armv8/libSVBCameraSDK.so"
            "$core/ToupTek/toupcamsdk.20260519/linux/arm64/glibc/libtoupcam.so"
            "$core/PlayerOne/PlayerOne_Camera_SDK_Linux_V3.10.1/lib/arm64/libPlayerOneCamera.so"
            "$core/PlayerOne/PlayerOne_FilterWheel_SDK_Linux_V1.2.3/lib/arm64/libPlayerOnePW.so"
            "$core/QHY/sdk_linux_arm64_26.07.28/usr/local/lib/libqhyccd.so"
          )
          for lib in "${libs[@]}"; do
            if compgen -G "${lib}*" > /dev/null; then
              echo "Staging $(basename "$lib")*"
              sudo cp -a "${lib}"* /usr/local/lib/
            else
              echo "WARNING: ${lib}* not found — skipping"
            fi
          done
          sudo ldconfig

      - name: Restore the compiler cache
        # Keyed per job; see the build-test job.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-sanitizers-tsan-${{ github.sha }}
          restore-keys: ccache-sanitizers-tsan-

      - name: Build AlpacaCore tests with TSan and run the concurrency stress suite
        # The [stress] tests (issue #101) hammer connect()/disconnect()/
        # set_connected() and operational calls from many threads — the #1
        # driver-review bug class (use-after-close, dropped racing
        # disconnects, destructor vs connection-thread races), which the
        # single-threaded ASan job and ConformU cannot see. ThreadSanitizer
        # turns a latent data race into a hard job failure. Vendors are ON so
        # every AsyncConnectable driver compiles; the ToupTek stress targets
        # run over the fake SDK seam (no hardware), and the suppressions file
        # mutes the uninstrumented proprietary vendor blobs, whose internals
        # we can neither see nor fix.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/scripts/tsan_suppressions.txt"
        run: |
          set -euo pipefail
          cmake -S AlpacaCore -B AlpacaCore/build-tsan \
            -DALPACACORE_BUILD_TESTS=ON \
            -DALPACACORE_ENABLE_ALL_VENDORS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build AlpacaCore/build-tsan --parallel "$(nproc)"
          test -x AlpacaCore/build-tsan/tests/alpacacore_tests  # Catch2 missing = silent skip; fail loudly instead
          # A tag filter matching ZERO tests exits 0 ("No tests ran") — if an
          # environment change ever drops the vendor targets that register the
          # [stress] cases, the job must fail rather than green-light with no
          # concurrency coverage. Assert on the run summary, which reflects
          # what actually executed and works on any Catch2 version, unlike
          # --list-tests output counting (issue #117).
          #
          # [stress] is reserved for vendor driver registrations ONLY, so this
          # grep's threshold means what it says regardless of how many vendor
          # targets are actually configured. Core/harness self-tests use a
          # DIFFERENT tag ([stress-guard], run separately below) precisely so
          # they cannot inflate this count and mask every vendor target
          # silently vanishing.
          #
          # This invariant had to be RESTORED, not merely stated: the
          # AsyncConnectable lifecycle case in test_async_connectable.cpp
          # carried [stress] while sitting in the unconditional TEST_SOURCES
          # block, so with every vendor target absent this filter still matched
          # one case, printed "All tests passed (2 assertions in 1 test case)",
          # and the grep below accepted it -- this job went green with zero
          # vendor concurrency coverage. That case is now [stress-guard]
          # (issue #322 review finding). Keep it that way: anything tagged
          # [stress] that is not a vendor registration makes this gate vacuous
          # again.
          #
          # The [stress] cases run as Catch2 shards (--shard-count/--shard-index)
          # in parallel processes, one per core: run serially they took about
          # 7.75 min of a 9.4 min job, mostly waiting on fakes in real time,
          # and the all-vendors ctest already runs them in parallel processes.
          # Each shard's exit code is the pass/fail gate and its log is shown in
          # its own group; the grep guards the zero-test case per shard, so it
          # deliberately matches both Catch2 summary forms.
          shards="$(nproc)"
          pids=()
          # A subshell per shard, so `wait` returns the test's status through
          # pipefail rather than tee's (a bare background pipeline's $! is tee).
          for ((i = 0; i < shards; i++)); do
            (
              set -o pipefail
              ./AlpacaCore/build-tsan/tests/alpacacore_tests "[stress]" \
                --shard-count "${shards}" --shard-index "${i}" 2>&1 | tee "stress-run-${i}.log" > /dev/null
            ) &
            pids+=("$!")
          done
          failed=()
          for ((i = 0; i < shards; i++)); do
            wait "${pids[i]}" || failed+=("${i}")
          done
          for ((i = 0; i < shards; i++)); do
            echo "::group::[stress] shard $((i + 1)) of ${shards}"
            cat "stress-run-${i}.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::[stress] shard index(es) ${failed[*]} failed; see their groups above"
            exit 1
          fi
          for ((i = 0; i < shards; i++)); do
            grep -qE '^(All tests passed \([0-9]+ assertions? in [1-9][0-9]* test cases?\)|test cases: *[1-9])' "stress-run-${i}.log" \
              || { echo "::error::[stress] shard index ${i} ran no tests"; exit 1; }
          done
          # Core/harness self-tests that need TSan but aren't a vendor
          # registration -- StressCallGuard's concurrency case and the
          # AsyncConnectable lifecycle case -- run under their own tag,
          # in their own invocation, with the same zero-test guard, so a typo'd
          # or dropped tag doesn't silently skip them either.
          ./AlpacaCore/build-tsan/tests/alpacacore_tests "[stress-guard]" | tee stress-guard-run.log
          grep -qE '^(All tests passed \([0-9]+ assertions? in [1-9][0-9]* test cases?\)|test cases: *[1-9])' stress-guard-run.log

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-sanitizers-tsan-${{ github.sha }}

  format:
    name: clang-format (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm   # text-only check; kept on arm64 for a single-arch fleet
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting of changed lines
        # git-clang-format reformats only the lines this PR touched, so adopting
        # .clang-format does not flag the pre-existing tree.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          # git-clang-format --diff exits non-zero when it finds differences.
          # `|| true` keeps `set -e` from aborting at this assignment so the
          # check below runs and prints the diff + fix hint, instead of the job
          # dying with a bare "exit 1" and no actionable output.
          diff="$(git-clang-format --commit "$merge_base" --diff \
            --extensions c,cc,cpp,cxx,h,hh,hpp,hxx)" || true
          if [ "$diff" != "no modified files to format" ] && \
             [ "$diff" != "clang-format did not modify any files" ]; then
            echo "$diff"
            echo "::error::Formatting issues on changed lines. Fix locally with: git-clang-format $merge_base"
            exit 1
          fi
          echo "Formatting OK"

  clang-tidy:
    name: clang-tidy (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm   # needs a real configure/build, which is arm64-only
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        # NOTE: libgpiod-dev is intentionally omitted — the ubuntu-24.04 runner
        # ships libgpiod 1.6, but the iOptron/ZWO GPIO switch drivers need >= 2.0.
        # We build v2 from source in the next step so clang-tidy parses the vendor
        # sources against v2 headers; otherwise the interpolated compile command
        # resolves the system v1 <gpiod.h> and reports spurious
        # clang-diagnostic-errors on v2 API usage (gpiod_line_value, etc.).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            g++ \
            clang-tidy \
            pkg-config \
            libusb-1.0-0-dev \
            libudev-dev \
            libsystemd-dev \
            libhidapi-dev \
            libltdl-dev \
            libexif-dev \
            libjpeg-dev \
            libraw-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Restore the libgpiod and libgphoto2 builds
        # Both build from vendored, checksum-pinned tarballs, so a build stays
        # the same until a pin or the gphoto script changes, and the key holds
        # both. A hit skips the two configure-and-make runs (about 35 to 45 s)
        # in every job that needs them: the all-vendors shards, TSan and
        # clang-tidy. Both install into a staging tree, copied into place below.
        id: deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/deps-stage
          key: deps-gpiod-${{ env.LIBGPIOD_VER }}-${{ env.LIBGPIOD_SHA256 }}-gphoto-${{ hashFiles('scripts/build_bundled_gphoto.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build libgpiod v2 and the bundled libgphoto2
        # On a cache miss only. libgpiod: the ZWO switch drivers need >= 2.0
        # (gpiod_chip_request_lines), which the runner's apt does not provide;
        # the tarball is vendored (AlpacaCore/external/libgpiod/, see the README
        # there: kernel.org removed old point releases) and its sha256 pin
        # (workflow env) guards against corruption. libgphoto2: the gphoto
        # driver links the vendored copy, never the distro one; the script
        # checks its own pin and, with --destdir, needs no root. Its build tree
        # goes under RUNNER_TEMP, out of the checkout.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          stage="${HOME}/deps-stage"
          cp "AlpacaCore/external/libgpiod/libgpiod-${LIBGPIOD_VER}.tar.xz" /tmp/libgpiod.tar.xz
          echo "${LIBGPIOD_SHA256}  /tmp/libgpiod.tar.xz" \
            | sha256sum -c -
          mkdir -p /tmp/libgpiod
          tar -xf /tmp/libgpiod.tar.xz -C /tmp/libgpiod --strip-components=1
          (
            cd /tmp/libgpiod
            ./configure --prefix=/usr/local --enable-tools=no --enable-bindings-cxx=no
            make -j"$(nproc)"
            make install DESTDIR="${stage}"
          )
          scripts/build_bundled_gphoto.sh --destdir "${stage}" --build-dir "${RUNNER_TEMP}/gphoto-src" --jobs "$(nproc)"

      - name: Install libgpiod v2 and the bundled libgphoto2
        # libgpiod into /usr/local, where CMake's find_library picks it up ahead
        # of any system copy; libgphoto2 into /usr/lib/alpacabridge/libgphoto2,
        # where the executables' rpath finds it.
        run: |
          set -euo pipefail
          sudo cp -a --no-preserve=ownership "${HOME}/deps-stage/." /
          sudo ldconfig

      - name: Wrap the compilers like build-vendors-shard
        # Keep paired with CCACHE_COMPILERCHECK=content and the restore below:
        # without the wrappers every lookup misses, silently.
        run: .github/scripts/coverage-compilers.sh

      - name: Restore the compiler cache
        # Restore only, from build-vendors-shard's cache: run_all_tests.sh configures
        # AlpacaHTTP/build with the same options (vendors ON, tests ON), and
        # this job builds with the same wrappers and flags, so the objects
        # match. This job runs on pull requests only, and a cache saved there
        # would be visible to that PR alone, so it saves nothing.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-all-vendors-coverage-${{ github.sha }}
          restore-keys: ccache-all-vendors-coverage-

      - name: Generate compile_commands.json (all vendors)
        # AlpacaHTTP pulls AlpacaCore in as a subdirectory, so this single
        # configure+build yields a compile DB covering both source trees and
        # materializes any generated headers before analysis. Vendors are ON so
        # vendor driver/wrapper sources get their real compile commands — with
        # vendors OFF they are absent from the DB and clang-tidy interpolates a
        # command without the vendored SDK include dirs, failing on e.g.
        # <PlayerOnePW.h> with a spurious clang-diagnostic-error.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
          CXXFLAGS: "--coverage -O0 -g"
          LDFLAGS: "--coverage"
        run: |
          set -euo pipefail
          ccache --zero-stats
          cmake -S AlpacaHTTP -B AlpacaHTTP/build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DALPACAHTTP_BUILD_TESTS=ON \
            -DALPACACORE_BUILD_TESTS=ON \
            -DALPACACORE_ENABLE_ALL_VENDORS=ON
          cmake --build AlpacaHTTP/build --parallel "$(nproc)"
          ccache --show-stats
          # A low hit rate means this build no longer matches build-vendors-shard's
          # (wrapper step, flags or configure drifted) and the cache is dead
          # weight. Warn rather than fail: a cold main cache is legitimate.
          ccache --print-stats | awk -F'\t' '
            $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { hits += $2 }
            $1 == "cache_miss" { misses += $2 }
            END {
              total = hits + misses
              if (total > 0 && hits * 2 < total)
                printf "::warning::clang-tidy build hit the compiler cache for %d of %d compiles\n", hits, total
            }'

      - name: Run clang-tidy on changed lines
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"

          tidy_diff="$(dpkg -L clang-tidy 2>/dev/null | grep -m1 -E 'clang-tidy-diff.*\.py' || true)"
          if [ -z "$tidy_diff" ]; then
            tidy_diff="$(find /usr -name 'clang-tidy-diff*.py' 2>/dev/null | head -1)"
          fi
          if [ -z "$tidy_diff" ]; then
            echo "::error::clang-tidy-diff.py not found"
            exit 1
          fi
          echo "Using $tidy_diff"

          # -U0: no context lines, so only genuinely changed lines are analyzed.
          # Restrict to our source/include dirs; the vendored external/ tree is
          # never fed in.
          git diff -U0 --no-color "$merge_base" -- \
            AlpacaCore/src AlpacaCore/include \
            AlpacaHTTP/src AlpacaHTTP/include \
            | python3 "$tidy_diff" -p1 -path AlpacaHTTP/build \
                -clang-tidy-binary clang-tidy 2>&1 | tee tidy.log

          # clang-tidy-diff exits 0 even when checks fire, so key off the output.
          if grep -qE ': (warning|error):' tidy.log; then
            echo "::error::clang-tidy reported issues on changed lines"
            exit 1
          fi
          echo "clang-tidy OK"

  package-deb:
    # Builds the .deb in the target distribution (no libgphoto2-dev installed),
    # installs it and runs the bundled-libgphoto2 acceptance checks, so a change
    # that breaks the packaged loader path fails before release.
    name: package-deb
    # Skips a PR into main, as sanitizers-tsan.
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev binutils

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.x pinned (immutable ref)
        with:
          persist-credentials: false

      - name: Install build dependencies
        # Read from debian/control so the package's Build-Depends stay the one list.
        run: |
          set -euo pipefail
          apt-get build-dep -y ./

      - name: Build the .deb
        run: |
          set -euo pipefail
          scripts/build_deb.sh
          ls -l ../alpacabridge_*_arm64.deb
          dpkg-deb --info ../alpacabridge_*_arm64.deb

      - name: Install the .deb
        # Recommends (NetworkManager, polkit) are not needed to run the checks.
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ../alpacabridge_*_arm64.deb

      - name: Check the bundled libgphoto2
        run: scripts/check_bundled_gphoto.sh

  static-checks:
    name: Static checks
    # The repository's text, script and JavaScript gates, each a step of one job:
    # every one takes seconds, and as ten jobs they held ten runners per run
    # (the org's limit is 20 concurrent jobs, and the merge queue runs ci.yml a
    # second time per PR). Each step runs even when an earlier one failed
    # (`!cancelled()`), so one run reports every red gate, and the step name
    # says which. Its `name` is one required check in the main ruleset.
    runs-on: ubuntu-24.04-arm   # pure text, script and JS scans; arch-independent
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history for the ConformU step, which diffs against the PR's base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install shellcheck and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nodejs

      - name: Unicode - Self-test the Unicode scanner
        if: ${{ !cancelled() }}
        # The scanner's failure mode is silence: a regressed scan_text() or
        # an empty file list reads as a clean tree. The self-test pins the
        # FORBIDDEN table, every helper, git-backed file listing and main()
        # over fixture files, so a broken gate fails here instead of passing
        # (issue #449).
        run: python3 .github/scripts/check-unicode.py --self-test

      - name: Unicode - Scan for Trojan-Source / invisible Unicode
        if: ${{ !cancelled() }}
        # Guards against CVE-2021-42574: bidi controls / zero-width characters
        # that make source render differently than it compiles. Excludes the
        # vendored external/ tree (see the script).
        run: python3 .github/scripts/check-unicode.py

      - name: Docs drift - Self-test check 8's pairing and job-scoping helpers
        if: ${{ !cancelled() }}
        # Literal fixtures, one per mutation the TSan pairing check exists
        # to catch, plus the next-job scoping rule checks 3 and 8 share
        # (issue #455). A matcher that stops matching fails here instead of
        # silently degrading the gate to its floor.
        run: python3 scripts/check_docs_drift.py --self-test

      - name: Docs drift - Self-test the decision-record gate scripts
        if: ${{ !cancelled() }}
        # check_adr_authorization.py runs from the default branch in
        # decision-records.yml and check_adr_scope.py in pr-body.yml and the
        # review bot; a broken copy would otherwise reach main first.
        run: |
          python3 scripts/check_adr_authorization.py --self-test
          python3 scripts/check_adr_scope.py --self-test

      - name: Docs drift - Check docs/config for self-inconsistency
        if: ${{ !cancelled() }}
        # Catches drift between the repo's own docs and its actual config
        # that nothing previously caught automatically. The script's module
        # docstring is the authoritative, numbered list of what it checks;
        # this comment deliberately does not repeat it (a summary here went
        # stale twice, issue #455).
        run: python3 scripts/check_docs_drift.py

      - name: Docs drift - Self-test and check the dependency snapshot inventory
        if: ${{ !cancelled() }}
        # dependency-submission.yml reports debian/control, the CMake fetches
        # and AlpacaCore/external/ to the dependency graph. --check fails a
        # directory under AlpacaCore/external/ that
        # scripts/dependency_sdk_versions.json does not list, so a new SDK
        # cannot reach the graph unreported. dependency_updates.py (run weekly by
        # dependency-updates.yml and osv-scan.yml) is self-tested here so a
        # broken checker fails the PR, not the next scheduled run.
        run: |
          python3 scripts/dependency_snapshot.py --self-test
          python3 scripts/dependency_snapshot.py --check
          python3 scripts/dependency_updates.py --self-test

      - name: Docs drift - Self-test the release-notes extractor
        if: ${{ !cancelled() }}
        # release.yml runs this too, but only on a tag push; here a broken
        # heading slug or section extractor fails the PR that caused it
        # instead of blocking the release.
        run: python3 scripts/changelog_section.py --self-test

      - name: Docs drift - Validate changelog fragments
        if: ${{ !cancelled() }}
        # A PR adds changelog.d/<branch-slug>.md instead of editing
        # CHANGELOG.md; a malformed fragment would break the release step.
        run: python3 scripts/changelog_fragments.py --self-test && python3 scripts/changelog_fragments.py --check

      - name: Docs drift - Self-test the debian/changelog generator
        if: ${{ !cancelled() }}
        # build_deb.sh feeds the fragments into the .deb changelog through
        # this script; nothing else exercises that path.
        run: python3 scripts/changelog_to_deb.py --self-test

      - name: Docs drift - Self-test the release tag mapping
        if: ${{ !cancelled() }}
        # release.yml runs this too, but only on a tag push or a dry run; here
        # a broken tag/VERSION mapping (scripts/release_tag_cases.txt) fails
        # the PR that caused it instead of the first beta tag.
        run: python3 scripts/release_tag.py --self-test

      - name: Docs drift - Self-test the nightly version
        if: ${{ !cancelled() }}
        # nightly-build.yml runs it only on main once a night; here a change to
        # it is tested by the PR that makes it.
        run: python3 scripts/nightly_version.py --self-test

      - name: Docs drift - Self-test the cache pruning rule
        if: ${{ !cancelled() }}
        # cache-prune.yml runs it only after a run on main; here a change to
        # which caches it deletes fails the PR that makes it.
        run: python3 scripts/prune_actions_caches.py --self-test

      - name: Docs drift - Self-test the merge-down exemption
        if: ${{ !cancelled() }}
        # pr-body.yml runs it on every PR as well; here a change to it is
        # tested by the PR that makes it, whatever that PR's head is named.
        run: python3 scripts/merge_down.py --self-test

      - name: Docs drift - Self-test the stable-PR issue closer
        if: ${{ !cancelled() }}
        # close-linked-issues.yml runs the script only on a merged stable PR;
        # here a change to its keyword parser fails the PR that makes it.
        run: python3 scripts/close_linked_issues.py --self-test

      - name: Docs drift - Self-test the scheduled-run issue reporter
        if: ${{ !cancelled() }}
        # scheduled-failure.yml runs it only after a scheduled run on main;
        # here a change to when it opens or closes an issue fails the PR.
        run: python3 scripts/scheduled_run_issue.py --self-test

      - name: Docs drift - Self-test the issue label checker
        if: ${{ !cancelled() }}
        # issue-labels.yml runs it on issue events only; here a change to which
        # labels count or when its comment is made or removed fails the PR.
        run: python3 scripts/check_issue_labels.py --self-test

      - name: Connect-error hook - Every AsyncConnectable driver exposes its connect-failure reason
        if: ${{ !cancelled() }}
        # A driver that inherits AsyncConnectable but omits
        # ALPACA_EXPOSE_CONNECT_ERROR() compiles and tests green while its
        # operators are told nothing but "Connection failed" (issue #358).
        # Nothing but this scan catches it.
        run: |
          python3 scripts/check_connect_error_hook.py --self-test
          python3 scripts/check_connect_error_hook.py

      - name: Serial port ownership - Every serial port is opened through util::SerialLink
        if: ${{ !cancelled() }}
        # A wrapper that opens a tty by hand compiles and tests green while
        # skipping the in-use registry, TIOCEXCL and the poll()-bounded reads,
        # so another device's probe can retune its live port and a retune can
        # hang Disconnect (issue #1202). Nothing but this scan catches it.
        run: |
          python3 scripts/check_serial_port_ownership.py --self-test
          python3 scripts/check_serial_port_ownership.py

      - name: Layering - Self-test the layering gate's fixtures
        if: ${{ !cancelled() }}
        run: python3 scripts/check_layering.py --self-test

      - name: Layering - AlpacaHTTP and catalog schema files include no new vendor headers
        if: ${{ !cancelled() }}
        # ADR 0004 (device-catalog) promises the layering gate enforces it;
        # issue #651. Counts alpacacore/vendor includes against a baseline.
        run: python3 scripts/check_layering.py

      - name: Stress registration - Self-test the check's own regexes and tag wiring
        if: ${{ !cancelled() }}
        # Regression guard for DEVICE_TYPE_OVERRIDE_RE / TEST_CASE_TAGS_RE
        # against synthetic snippets, independent of repo state. It also runs
        # the script's main() over temp files, so the two tag predicates, the
        # CMake gating rule and the StressCallGuard idiom rules are all
        # wired-up and covered -- deleting a `failures.extend(...)` line fails
        # here rather than passing silently.
        run: python3 scripts/check_stress_registration.py --self-test

      - name: Stress registration - Check [stress] coverage, and that neither stress tag is misplaced
        if: ${{ !cancelled() }}
        # The ci-gates instructions require a [stress] TEST_CASE for every driver exercised
        # by the sanitizers-tsan job; this was previously enforced only by
        # code review. See scripts/check_stress_registration.py.
        run: python3 scripts/check_stress_registration.py

      - name: Contract sweep - Self-test the gate's parsers and rules
        if: ${{ !cancelled() }}
        # Literal fixtures, one per rule (ADR 0003), independent of repo state.
        run: python3 scripts/check_contract_sweep.py --self-test

      - name: Contract sweep - Check every catalog-constructed driver is in the contract sweep
        if: ${{ !cancelled() }}
        # Issue #571: AlpacaCore/tests/contract_sweep.h must hold an entry for
        # every (vendor, deviceType) pair the device catalog constructs, or ALLOWLIST it with a reason.
        # Also checks the guard macros reach alpacacore_tests, so the registry cannot compile empty.
        run: python3 scripts/check_contract_sweep.py

      - name: ConformU reports - Self-test the ConformU report checker
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # main() returns 0 with "nothing to check" whenever the changed-file
        # list is empty, which is right for a PR that touches no report and
        # identical to the prefix filter, rename rule or base-ref resolution
        # having broken. The self-test drives every rule over synthetic
        # reports and the file list over a real temporary git repository
        # (issue #449).
        run: python3 scripts/check_conformu_reports.py --self-test

      - name: ConformU reports - Reject a failing or missing ConformU report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # /submit-pr already blocks this locally (a driver PR must ship a
        # clean AlpacaCore/conformu/** or AlpacaHTTP/conformu/** report), but
        # that's a prompt-only gate: a PR opened by hand, or from a fork not
        # using the skill, bypasses it. This is the same pass/fail logic as a
        # CI job so it can't be skipped.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          python3 scripts/check_conformu_reports.py "origin/$GITHUB_BASE_REF"

      - name: ShellCheck - Lint shell scripts
        if: ${{ !cancelled() }}
        # Our authored scripts only — the vendored external/ tree is skipped.
        # debian/ maintainer scripts have no .sh extension, so add them by name.
        run: |
          set -euo pipefail
          scripts=()
          while IFS= read -r f; do
            case "$f" in
              AlpacaCore/external/*) continue ;;
            esac
            scripts+=("$f")
          done < <(git ls-files '*.sh')
          for f in debian/alpacabridge.postinst debian/alpacabridge.postrm debian/alpacabridge.prerm debian/alpacabridge-software-update debian/alpacabridge-set-update-channel; do
            [ -f "$f" ] && scripts+=("$f")
          done
          echo "Linting: ${scripts[*]}"
          shellcheck "${scripts[@]}"

      - name: ShellCheck - ci_preflight.sh self-test (bash 3.2 guards, quick-run SKIPs)
        if: ${{ !cancelled() }}
        run: ./scripts/ci_preflight.sh --self-test

      - name: JavaScript - Syntax-check web UI JavaScript
        if: ${{ !cancelled() }}
        # The web UI is hand-written static JS served as-is (no bundler/build
        # step). `node --check` is the first half of its gate -- the unit-test
        # step below is the other -- and it parses each
        # file and reports syntax errors (stray braces, etc.) without executing
        # anything. Kept in sync with the javascript gate in
        # scripts/ci_preflight.sh.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'AlpacaHTTP/web/*.js')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No web JavaScript files — nothing to check."
            exit 0
          fi
          echo "Checking: ${files[*]}"
          for f in "${files[@]}"; do
            node --check "$f"
          done

      - name: JavaScript - Unit-test web UI JavaScript
        if: ${{ !cancelled() }}
        # `node --check` parses; it does not execute. web/format.js holds the
        # page's pure formatting helpers, whose contract includes three
        # fallback guards -- one of them (an engine that ignores hourCycle and
        # answers in 12-hour form) renders a plausible-looking WRONG time
        # rather than an obvious failure. `node --test` ships with the Node
        # the step above installs, so this needs no dependency and no
        # package.json. Kept in sync with the javascript gate in
        # scripts/ci_preflight.sh. See open-astro#385.
        run: |
          set -euo pipefail
          # Explicit file list, not `node --test <dir>`: the directory form
          # works on Node 20 but the runner's Node 22 resolves the path as a
          # module and dies with MODULE_NOT_FOUND, which is how this job first
          # failed. A glob of the test files behaves the same on both.
          mapfile -t tests < <(git ls-files 'AlpacaHTTP/tests/web/*.test.js')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No web JavaScript tests — nothing to run."
            exit 1
          fi
          echo "Running: ${tests[*]}"
          node --test "${tests[@]}"

  cppcheck:
    name: cppcheck (changed files)
    # Runs on pushes too, but only to build and save the cppcheck cache: a cache
    # saved by a pull request is visible to that PR alone, one saved on main to
    # every PR. The analysis step stays pull-request only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CPPCHECK_PREFIX: /home/runner/.local/cppcheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the cppcheck build
        id: cppcheck-cache
        # The pin lives in the next step's ver=/sha256= lines (scripts/
        # dependency_snapshot.py reads it there), so the key follows ci.yml and
        # restore-keys falls back to an older entry. The next step decides
        # whether that entry is usable: it rebuilds unless the restored binary
        # reports the pinned version. The prefix is fixed because cppcheck
        # compiles its data directory path in.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CPPCHECK_PREFIX }}
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: cppcheck-${{ runner.os }}-${{ runner.arch }}-

      - name: Build cppcheck 2.17.x from source
        # The ubuntu-24.04 runner ships cppcheck 2.13, which classifies some
        # checks differently from current cppcheck (e.g. virtualCallInConstructor
        # is a `warning` in 2.13 but reclassified in 2.17). Our dev/target
        # environment is Debian 13 Trixie (cppcheck 2.17), and scripts/ci_preflight.sh
        # runs whatever the dev box has — so pinning CI to 2.17 keeps the local
        # pre-flight and CI in agreement. Built from source (matching the libgpiod
        # pattern below); the tarball is checksum-verified before it is unpacked.
        run: |
          set -euo pipefail
          ver=2.17.1
          sha256=bfd681868248ec03855ca7c2aea7bcb1f39b8b18860d76aec805a92a967b966c
          if [ -x "${CPPCHECK_PREFIX}/bin/cppcheck" ] \
             && [ "$("${CPPCHECK_PREFIX}/bin/cppcheck" --version)" = "Cppcheck ${ver}" ]; then
            echo "Restored cppcheck ${ver} from the cache; not rebuilding."
            exit 0
          fi
          rm -rf "${CPPCHECK_PREFIX}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake g++
          curl -fsSL "https://github.com/danmar/cppcheck/archive/refs/tags/${ver}.tar.gz" \
            -o /tmp/cppcheck.tar.gz
          echo "${sha256}  /tmp/cppcheck.tar.gz" | sha256sum --check --strict -
          mkdir -p /tmp/cppcheck
          tar -xf /tmp/cppcheck.tar.gz -C /tmp/cppcheck --strip-components=1
          cmake -S /tmp/cppcheck -B /tmp/cppcheck/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${CPPCHECK_PREFIX}"
          cmake --build /tmp/cppcheck/build --parallel "$(nproc)"
          cmake --install /tmp/cppcheck/build

      - name: Save the cppcheck build
        if: github.event_name == 'push' && steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CPPCHECK_PREFIX }}
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Put cppcheck on the PATH
        run: |
          set -euo pipefail
          echo "${CPPCHECK_PREFIX}/bin" >> "$GITHUB_PATH"
          "${CPPCHECK_PREFIX}/bin/cppcheck" --version

      - name: Analyze changed C/C++ files
        if: github.event_name == 'pull_request'
        # A second static-analysis engine alongside clang-tidy — it catches
        # different defects. Scoped to files this PR changes so the existing
        # tree is not bulk-flagged (same policy as clang-tidy/clang-format);
        # the vendored external/ tree is never included. Suppress false
        # positives inline with `// cppcheck-suppress <id>`.
        # normalCheckLevelMaxBranches is an info-only note (cppcheck >= 2.14)
        # about analysis depth, not a defect; suppressed so the gate stays quiet.
        # virtualCallInConstructor fires on the deliberate set_connected(false)
        # shutdown call in every driver destructor (AGENTS.md gold-standard). For
        # these concrete leaf drivers the dynamic type during their own destructor
        # is correct, so it is a benign general-hazard flag, not a real defect; it
        # is a pervasive intentional pattern, hence suppressed globally rather than
        # inline. Suppressed defensively: 2.17 does not report it, but an older
        # cppcheck (e.g. the runner's apt 2.13) does under --enable=warning.
        # Keep this --suppress list identical to scripts/ci_preflight.sh.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$merge_base" HEAD -- \
            AlpacaCore/src AlpacaCore/include AlpacaHTTP/src AlpacaHTTP/include \
            | grep -E '\.(c|cc|cpp|cxx|h|hpp|hxx)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C/C++ files — nothing to analyze."
            exit 0
          fi
          printf 'Analyzing:\n%s\n' "${files[*]}"
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --std=c++20 \
            --language=c++ \
            --error-exitcode=2 \
            --quiet \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=virtualCallInConstructor \
            -I AlpacaCore/include -I AlpacaHTTP/include \
            "${files[@]}"

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        # Prebuilt arm64 release binary — no Rust toolchain / pip build needed.
        # The tarball is checksum-verified before it runs: a security-audit job
        # must not itself execute an unverified download. Bump both `ver` and
        # `sha256` together when upgrading (GitHub release assets are immutable,
        # so the hash is stable for a given version). scripts/ci_preflight.sh
        # mirrors this install (ZIZMOR_VER / ZIZMOR_SHA256) — update both.
        run: |
          set -euo pipefail
          ver=1.31.1
          sha256=37eebbd5762a44f262d94875431b14a6d2402991e90a685113ea97b8b41be833
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ver}/zizmor-aarch64-unknown-linux-gnu.tar.gz" \
            -o /tmp/zizmor.tgz
          echo "${sha256}  /tmp/zizmor.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/zizmor.tgz -C /tmp
          # Fail explicitly if a future release changes the archive layout,
          # rather than relying on `install` to error on a missing path.
          if [ ! -x /tmp/zizmor ]; then
            echo "::error::zizmor binary not found at /tmp/zizmor after extraction (archive layout changed?)"
            exit 1
          fi
          sudo install /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: Audit workflows
        # Offline audit: deterministic, no token/network. Audits the workflow
        # files for security issues (injection, over-broad permissions, etc.).
        run: zizmor --offline .github/workflows/
