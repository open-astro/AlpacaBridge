# PR-body gates. Separate from ci.yml so that editing the PR body re-runs only
# this job and not the whole CI.
#
# Jobs:
#   falsified-by   every new test case needs a `Falsified by:` line in the PR
#                  body naming the mutation that fails it
#                  (scripts/check_falsified_by.py)
#   pr-template    the body keeps every section of
#                  .github/PULL_REQUEST_TEMPLATE.md, each filled in
#                  (scripts/check_pr_template.py); bot PRs (Dependabot) skip it

name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  falsified-by:
    name: falsified-by (PR body)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge-down exemption
        id: merge_down
        # A merge down (docs/beta-channel.md) carries test cases already listed
        # on the fix PRs that landed them on stable/X.Y; against this base every
        # one reads as new again. scripts/merge_down.py exempts only the real
        # shape: a merge-down/X.Y-to-<target> head in this repository, the base
        # it names (main or stable/X.Z), and no commit that is not already on
        # stable/X.Y. The head name is untrusted text: env only.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python3 scripts/merge_down.py --self-test
          if python3 scripts/merge_down.py --exempt --head-ref "${HEAD_REF}" --base-ref "${BASE_REF}" \
               --base-rev "${BASE_SHA}" --head-rev "${HEAD_SHA}" --same-repo "${SAME_REPO}"; then
            echo "exempt=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exempt=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check Falsified by lines
        if: steps.merge_down.outputs.exempt != 'true'
        # The PR body is untrusted text (fork PRs): it reaches the script only
        # through the environment, never through a `${{ }}` expansion in `run:`.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          FALSIFIED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check_falsified_by.py --self-test
          python3 scripts/check_falsified_by.py

  pr-template:
    name: pr-template (PR body)
    # Dependabot writes its own body; the template is for people and agents.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the PR template sections
        # Untrusted text again: the body reaches the script only through env.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/check_pr_template.py --self-test
          python3 scripts/check_pr_template.py
