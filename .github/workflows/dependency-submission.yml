# Submits the C++ build's dependencies (debian/control, CMake fetches, vendored
# SDKs) to GitHub's dependency graph, which otherwise sees only the workflow
# action pins. Snapshot built by scripts/dependency_snapshot.py; see
# docs/development.md "Dependency graph". No pull_request trigger: the drift
# check runs in ci.yml's docs-drift job.

name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    name: Submit dependency snapshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write   # the Dependency Submission API requires it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # debian/control and ci.yml's apt tools are unpinned (>= or bare names), so report the
      # version apt would install today: debian:trixie (the image release.yml builds the .deb
      # in) for debian/control, this Ubuntu 24.04 runner for the CI tools.
      - name: Resolve apt candidate versions
        run: |
          mapfile -t deb_pkgs < <(python3 scripts/dependency_snapshot.py --apt-packages debian)
          docker run --rm -e LC_ALL=C debian:trixie \
            sh -c 'apt-get update -qq >/dev/null && apt-cache policy "$@"' sh "${deb_pkgs[@]}" > debian-policy.txt
          mapfile -t ubuntu_pkgs < <(python3 scripts/dependency_snapshot.py --apt-packages ubuntu)
          sudo apt-get update -qq
          LC_ALL=C apt-cache policy "${ubuntu_pkgs[@]}" > ubuntu-policy.txt

      - name: Build snapshot
        run: |
          python3 scripts/dependency_snapshot.py --check
          python3 scripts/dependency_snapshot.py --debian-policy debian-policy.txt \
            --ubuntu-policy ubuntu-policy.txt --output snapshot.json

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input snapshot.json
