# Submits the C++ build's dependencies (debian/control, CMake fetches, vendored
# SDKs) to GitHub's dependency graph, which otherwise sees only the workflow
# action pins. Snapshot built by scripts/dependency_snapshot.py; see
# docs/development.md "Dependency graph". No pull_request trigger: the drift
# check runs in ci.yml's docs-drift job.

name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    name: Submit dependency snapshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write   # the Dependency Submission API requires it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ${shlibs:Depends} is known only after a package build, so the run-time libraries come from
      # the latest nightly .deb (built from main every night, so it can trail main by a day). They
      # go in this snapshot rather than one the nightly submits, so every push carries them with
      # the current commit. With no nightly to read (a fork), the snapshot leaves them out.
      - name: Fetch the nightly .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nightly
          if ! gh release download nightly-build --repo "${GITHUB_REPOSITORY}" --pattern '*_arm64.deb' --dir nightly; then
            echo "::warning::no nightly-build .deb to read: the snapshot leaves out the resolved Depends"
          fi
          ls -l nightly
          # The nightly uploads its new .deb before it deletes the old one, so a push in between finds
          # two. Their names carry a nightlyYYYYMMDDHHMM stamp: the newest stamp wins (not the full
          # name, which sorts 5.0.10 before 5.0.9), and the later steps read it from NIGHTLY_DEB.
          n=$(find nightly -name '*.deb' | wc -l)
          if [ "${n}" -gt 1 ]; then echo "::warning::${n} nightly .deb files; using the newest"; fi
          newest=$(python3 scripts/dependency_snapshot.py --newest-deb nightly)
          if [ -n "${newest}" ]; then echo "NIGHTLY_DEB=${newest}" >> "${GITHUB_ENV}"; fi

      # debian/control and ci.yml's apt tools are unpinned (>= or bare names), so report the
      # version apt would install today: debian:trixie (the image release.yml builds the .deb
      # in) for debian/control, this Ubuntu 24.04 runner for the CI tools.
      - name: Resolve apt candidate versions
        run: |
          deb_args=(); if [ -n "${NIGHTLY_DEB:-}" ]; then deb_args=(--deb "${NIGHTLY_DEB}"); fi
          mapfile -t deb_pkgs < <(python3 scripts/dependency_snapshot.py --apt-packages debian "${deb_args[@]}")
          docker run --rm -e LC_ALL=C debian:trixie \
            sh -c 'apt-get update -qq >/dev/null && apt-cache policy "$@"' sh "${deb_pkgs[@]}" > debian-policy.txt
          mapfile -t ubuntu_pkgs < <(python3 scripts/dependency_snapshot.py --apt-packages ubuntu)
          sudo apt-get update -qq
          LC_ALL=C apt-cache policy "${ubuntu_pkgs[@]}" > ubuntu-policy.txt

      - name: Build snapshot
        run: |
          deb_args=(); if [ -n "${NIGHTLY_DEB:-}" ]; then deb_args=(--deb "${NIGHTLY_DEB}"); fi
          python3 scripts/dependency_snapshot.py --check
          python3 scripts/dependency_snapshot.py "${deb_args[@]}" --debian-policy debian-policy.txt \
            --ubuntu-policy ubuntu-policy.txt --output snapshot.json

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input snapshot.json
