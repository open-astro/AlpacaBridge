# AlpacaHTTP Configuration

# HTTP server settings
http:
  port: 6800
  thread_pool_size: 32  # Number of concurrent request handlers (increase for more devices/clients). Env: ALPACAHTTP_THREAD_POOL_SIZE (1-256)
  host_check_enabled: false  # Refuse requests whose Host header is not an allowed name (DNS-rebinding guard). Off by default: any Host name is served. Env: ALPACAHTTP_HOST_CHECK (true/false)
  allowed_hosts: ""  # Only used when host_check_enabled is true. Extra names the web UI and API accept as the request's Host header, comma-separated. Always allowed: IP addresses, localhost and *.localhost, this machine's hostname, *.local, *.home.arpa and *.internal. A leading dot allows a domain and every name under it (.lan allows pi.lan). Other names get HTTP 403. Env: ALPACAHTTP_ALLOWED_HOSTS

# Discovery settings
discovery:
  enabled: true

# Logging settings
logging:
  level: WARNING  # DEBUG, INFO, WARNING, ERROR
  file_enabled: true  # Write logs to disk in addition to stderr. Env: ALPACAHTTP_FILE_LOGGING
  directory: /var/log/AlpacaBridge  # Daily files: alpacabridge-YYYY-MM-DD.log. Env: ALPACAHTTP_LOG_DIRECTORY. Falls back to $XDG_STATE_HOME/AlpacaBridge/logs (or ~/.local/state/AlpacaBridge/logs) if not writable.
  retention_days: 90  # Auto-delete daily files older than this. 0 = keep forever. Env: ALPACAHTTP_LOG_RETENTION_DAYS

# Server information
server:
  name: AlpacaHTTP
  manufacturer: OpenAstro.net
  location: ""
  profile_name: ""  # Friendly profile name shown in the web UI header and exposed via the management API. Env: ALPACAHTTP_PROFILE_NAME
  sync_system_clock_from_clients: true  # On an NTP-less host, step the system clock from a client's Telescope.UTCDate write. Never touches an NTP-disciplined clock.
  motion_watchdog_seconds: 30  # While a goto or MoveAxis is running, stop the mount if no Alpaca request has reached the telescope for this long (client crashed, host asleep, network gone). Never fires on a tracking- or guiding-only mount. Connected stays true. 0 disables. Env: ALPACAHTTP_MOTION_WATCHDOG_SECONDS
  update_packages_url: https://apt.openastro.net/dists/trixie/main/binary-arm64/Packages  # APT Packages index the web UI's "Check for Updates" reads to find the newest alpacabridge release. Only the check uses it; "Install Update" runs apt against the host's own configured sources. Empty disables the check. Env: ALPACAHTTP_UPDATE_PACKAGES_URL
  update_release_notes_url: https://raw.githubusercontent.com/open-astro/AlpacaBridge/v{version}/docs/releases/{version}.md  # Plain-language notes for the newer release, shown in the card before you install ({version} is replaced). Empty disables. Env: ALPACAHTTP_UPDATE_RELEASE_NOTES_URL
  update_release_url: https://github.com/open-astro/AlpacaBridge/releases/tag/v{version}  # The release page the card links to. Empty disables. Env: ALPACAHTTP_UPDATE_RELEASE_URL

# Device enable/disable (optional)
# devices:
#   camera:
#     0: true
#     1: false
#   mount:
#     0: true