# AlpacaHTTP Configuration

# HTTP server settings
http:
  port: 6800
  thread_pool_size: 32  # Number of concurrent request handlers (increase for more devices/clients). Env: ALPACAHTTP_THREAD_POOL_SIZE (1-256)

# Discovery settings
discovery:
  enabled: true

# Logging settings
logging:
  level: WARNING  # DEBUG, INFO, WARNING, ERROR
  file_enabled: true  # Write logs to disk in addition to stderr. Env: ALPACAHTTP_FILE_LOGGING
  directory: /var/log/AlpacaBridge  # Daily files: alpacabridge-YYYY-MM-DD.log. Env: ALPACAHTTP_LOG_DIRECTORY. Falls back to $XDG_STATE_HOME/AlpacaBridge/logs (or ~/.local/state/AlpacaBridge/logs) if not writable.
  retention_days: 90  # Auto-delete daily files older than this. 0 = keep forever. Env: ALPACAHTTP_LOG_RETENTION_DAYS

# Server information
server:
  name: AlpacaHTTP
  manufacturer: OpenAstro.net
  location: ""
  profile_name: ""  # Friendly profile name shown in the web UI header and exposed via the management API. Env: ALPACAHTTP_PROFILE_NAME

# Device enable/disable (optional)
# devices:
#   camera:
#     0: true
#     1: false
#   mount:
#     0: true