# AlpacaHTTP Configuration

# HTTP server settings
http:
  port: 6800
  thread_pool_size: 32  # Number of concurrent request handlers (increase for more devices/clients)

# Discovery settings
discovery:
  enabled: true

# Logging settings
logging:
  level: WARNING  # DEBUG, INFO, WARNING, ERROR

# Server information
server:
  name: AlpacaHTTP
  manufacturer: AlpacaHTTP
  location: ""

# Device enable/disable (optional)
# devices:
#   camera:
#     0: true
#     1: false
#   mount:
#     0: true
